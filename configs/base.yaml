# Базовая конфигурация ЛР0.
# Задаёт исходные условия обучения, с которыми будем сравнивать
# настройки, найденные при подборе гиперпараметров.
# Код обучения прочитает эти значения из файла.

experiment: lr0

# Seed разбиения данных. Должен совпадать с подготовленным split.json.
split_seed: 0

# Seed обучения: начальные веса, порядок батчей и случайность dropout.
seed: 0

model:
  # Количество скрытых слоёв.
  n_layers: 1

  # Количество нейронов в каждом скрытом слое.
  hidden: 64

  # Вероятность отключения активаций при обучении.
  # Значение 0.0 означает, что dropout выключен.
  dropout: 0.0

train:
  # Скорость обучения оптимизатора Adam.
  lr: 0.001

  # Регуляризация весов: 0.0 означает, что она выключена.
  weight_decay: 0.0

  # Количество изображений в одном обучающем батче.
  batch_size: 64

  # Количество проходов по обучающей выборке.
  epochs: 30

runtime:
  # Обучение на центральном процессоре.
  device: cpu

  # Количество вычислительных потоков PyTorch.
  num_threads: 1